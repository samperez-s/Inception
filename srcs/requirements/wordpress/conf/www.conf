[www]
user = www-data
group = www-data
listen = 0.0.0.0:9000  ; Listen on all interfaces on port 9000, instead of a Unix socket
                        ; This allows nginx (in another container) to reach php-fpm

pm = dynamic            ; Process manager mode: spawn/kill workers based on demand
pm.max_children = 5     ; Maximum number of PHP worker processes running simultaneously
pm.start_servers = 2    ; Workers spawned on startup
pm.min_spare_servers = 1 ; Minimum idle workers kept alive waiting for requests
pm.max_spare_servers = 3 ; Maximum idle workers before some get killed